
name: Test connexion HelloAsso

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Tester authentification avec curl
        env:
          HELLOASSO_CLIENT_ID: ${{ secrets.HELLOASSO_CLIENT_ID }}
          HELLOASSO_CLIENT_SECRET: ${{ secrets.HELLOASSO_CLIENT_SECRET }}
        run: |
          set +x

          echo "Test de connexion HelloAsso avec curl..."

          HTTP_CODE=$(curl --silent --show-error \
            --output response.json \
            --write-out "%{http_code}" \
            --request POST \
            "https://api.helloasso.com/oauth2/token" \
            --header "Content-Type: application/x-www-form-urlencoded" \
            --header "Accept: application/json" \
            --data-urlencode "grant_type=client_credentials" \
            --data-urlencode "client_id=$HELLOASSO_CLIENT_ID" \
            --data-urlencode "client_secret=$HELLOASSO_CLIENT_SECRET")

          echo "Code HTTP reçu : $HTTP_CODE"

          if [ "$HTTP_CODE" = "200" ]; then
            python -c "import json; d=json.load(open('response.json')); print('Connexion réussie'); print('Jeton reçu :', bool(d.get('access_token'))); print('Renouvellement reçu :', bool(d.get('refresh_token')))"
          else
            echo "Réponse du serveur :"
            head -c 1000 response.json
            echo
            exit 1
          fi
