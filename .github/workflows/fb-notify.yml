name: Facebook RSS to Firebase Notification

on:
  schedule:
    - cron: "0 */6 * * *" # Toutes les 6 heures
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-feed:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install feedparser beautifulsoup4 firebase-admin

      - name: Run notification check
        env:
          FETCHRSS_URL: ${{ secrets.FETCHRSS_URL }}
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          FCM_TOPIC: smtt_actus
        run: python notify_fb.py

      - name: Commit updated state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/last_fb_post.json || true
          git diff --staged --quiet || git commit -m "chore: update last seen Facebook post"
          git push
